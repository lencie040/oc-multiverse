<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>オリキャラ多元宇宙</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=34">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="stage"></div>

  <header id="top">
    <nav id="crumbs"></nav>
    <div id="clock"><span id="clk-icon">☀️</span><b id="clk-text">--</b><small id="sync-st"></small></div>
    <button id="tg-director" class="topbtn" title="おまかせ観戦 (O)">🎬 おまかせ観戦</button>
    <button id="tg-space" class="topbtn" title="おまかせ観戦を、世界線の中に入らず宇宙（世界団マップ）から見る。グラフィック「最高」の時だけ" hidden>🔭 宇宙から観戦</button>
    <button id="tg-news" class="topbtn" title="日報を見る">📰 日報</button>
    <div id="searchbox">
      <input id="search" type="search" placeholder="世界線・キャラを検索（/）" autocomplete="off">
      <div id="results" hidden></div>
    </div>
    <div id="toggles">
      <label><input type="checkbox" id="tg-names" checked> キャラ名</label>
      <label><input type="checkbox" id="tg-wnames" checked> 世界線名</label>
      <label><input type="checkbox" id="tg-toast" checked> テロップ</label>
      <button id="tg-panels" title="パネルの表示切替 (H)">▤ パネル</button>
      <button id="tg-settings" title="設定">⚙️ 設定</button>
    </div>
    <div id="settings" hidden>
      <label>グラフィック
        <select id="set-gfx">
          <option value="low">低（軽い）</option>
          <option value="mid">中</option>
          <option value="high">高</option>
          <option value="ultra">最高（宇宙から世界線の中が見える）</option>
        </select>
      </label>
      <label>UIの大きさ <input type="range" id="set-ui" min="70" max="150" step="5"> <b id="set-ui-v"></b></label>
    </div>
  </header>

  <div id="wtitle" hidden></div>
  <div id="toasts"></div>
  <div id="caption" hidden></div>
  <div id="fade"></div>
  <canvas id="warp"></canvas>
  <div id="cutin" hidden></div>
  <div id="titlecard" hidden></div>
  <div id="news" hidden></div>

  <aside id="events" class="panel">
    <div class="ph">
      <b>主な出来事</b>
      <div class="tabs"><button data-f="all" class="on">すべて</button><button data-f="here">この世界線</button></div>
    </div>
    <label class="minor"><input type="checkbox" id="tg-minor"> 細かい出来事も表示</label>
    <div id="evlist"></div>
  </aside>

  <aside id="info" class="panel"></aside>

  <footer id="help">
    <span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 移動</span>
    <span><kbd>Q</kbd><kbd>E</kbd> 回転</span>
    <span>ホイール / <kbd>R</kbd><kbd>F</kbd> 拡大縮小</span>
    <span>ドラッグ 視点</span>
    <span><kbd>T</kbd> 追跡</span>
    <span><kbd>H</kbd> パネル</span>
    <span><kbd>O</kbd> おまかせ</span>
    <span><kbd>Esc</kbd> 戻る</span>
    <span id="soundbox">
      <button id="tg-sound" title="音のオン・オフ (M)">🔊</button>
      <label title="BGMの音量">BGM <input type="range" id="vol-bgm" min="0" max="100"></label>
      <label title="効果音の音量">SE <input type="range" id="vol-se" min="0" max="100"></label>
      <span id="track"></span>
    </span>
    <span id="legend"></span>
  </footer>

  <div id="loading">
    <div class="ld-in">
      <h1>オリキャラ多元宇宙</h1>
      <div class="ld-bar"><i></i></div>
      <p>宇宙を準備しています…</p>
    </div>
  </div>

  <script type="module" src="js/main.js?v=34"></script>
</body>
</html>
